apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Moved above `android {}` on 2026-09-21. The Crashlytics plugin registers its
// `firebaseCrashlytics {}` extension per build type AT APPLY TIME, so with the
// applies at the bottom of this file the extension does not exist while
// buildTypes is being evaluated and configuration fails with "Could not find
// method firebaseCrashlytics() ... on BuildType$AgpDecorated_Decorated".
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
// Ship only the icon fonts the app renders (react-native-vector-icons copies
// all 19 by default). FontAwesome6 needs Regular AND Solid: icons without the
// `solid` prop that Regular lacks fall back to Solid. Importing another family
// (e.g. MaterialIcons) means adding its .ttf here, or it renders as blanks.
project.ext.vectoricons = [
    iconFontNames: [ "Ionicons.ttf", "FontAwesome.ttf", "FontAwesome6_Regular.ttf", "FontAwesome6_Solid.ttf" ]
]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
// fonts.gradle copies into build/intermediates without clearing it first, so
// fonts dropped from iconFontNames would keep shipping from earlier builds.
afterEvaluate {
    tasks.findByName("copyReactNativeVectorIconFonts")?.doFirst {
        delete "$buildDir/intermediates/ReactNativeVectorIcons/fonts"
    }
}

react { autolinkLibrariesWithApp() }

def enableProguardInReleaseBuilds = true
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
  ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdk rootProject.ext.compileSdkVersion

  namespace "com.bloxfruitevalues"
  defaultConfig {
    applicationId "com.bloxfruitevalues"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 186
    versionName "4.0.37"
    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a" // single declaration
    }
  }

  
  packaging {
    // 32-bit x86 only. x86_64 was removed from this list on 2026-09-21.
    //
    // `packaging.jniLibs.excludes` is what ACTUALLY controls which ABIs ship -
    // it filters the prebuilt .so files that arrive inside AAR dependencies,
    // which in a React Native app is most of them. `ndk.abiFilters` does NOT:
    // it only filters code built via externalNativeBuild. Proven by building
    // the same AAB with and without x86_64 in abiFilters (identical output),
    // and again here where abiFilters omitted x86 yet an x86 dir still appeared
    // in merged_native_libs and was removed only by this exclude.
    //
    // Do not credit abiFilters for this fix. mm2values' build.gradle comment
    // makes that mistake; its jniLibs line is what works.
    jniLibs { excludes += ["**/x86/**"] }
  }

  signingConfigs {
    release {
      // ⚠️ move these to gradle.properties or env vars
      storeFile file('solanalab.keystore')
      storePassword '798702'
      keyAlias 'solanalabdev'
      keyPassword '798702'
    }
  }

  buildTypes {
    debug { signingConfig signingConfigs.debug }
    release {
      signingConfig signingConfigs.release
      minifyEnabled enableProguardInReleaseBuilds
      shrinkResources enableProguardInReleaseBuilds
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
      // Upload native debug symbols so native crashes (SIGSEGV/SIGABRT from
      // libc.so, Hermes, or any .so) arrive symbolicated instead of as a wall
      // of bare `at` frames. There was no firebaseCrashlytics block here at
      // all, so every native crash this app has ever reported was
      // undiagnosable.
      //
      // The task-name segment ("mergeReleaseNativeLibs") is NOT optional: AGP 8
      // moved intermediates from <type>/out/ to <type>/<taskName>/out/, and
      // pointing at the old layout fails SILENTLY - the plugin uploads nothing
      // and never errors. See HANDOFF_2026-09-21.md in adoptme-jan7.
      //
      // NOTE: uploadCrashlyticsSymbolFileRelease does NOT run as part of
      // bundleRelease. Invoke it explicitly for every shipped build:
      //   ./gradlew :app:bundleRelease :app:uploadCrashlyticsSymbolFileRelease
      firebaseCrashlytics {
        nativeSymbolUploadEnabled true
        unstrippedNativeLibsDir "build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib"
      }
    }
  }
}

// ---- Fix the WorkManager version clash ----


// ── Drop RevenueCat's Amazon Appstore module ─────────────────────────────────
// The app is only sold on Google Play and the App Store (the RevenueCat
// project has no Amazon app, and nothing sets useAmazon), so the Amazon IAP
// SDK it pulls in (~400 com.amazon.* classes) is dead weight. Same exclusion as
// adoptme-jan7. If the app ever ships to the Amazon Appstore, delete this block.
configurations.configureEach {
    exclude group: 'com.revenuecat.purchases', module: 'purchases-store-amazon'
}

dependencies {
  implementation("com.facebook.react:react-android")
  implementation("androidx.collection:collection:1.4.4")

  // JS engine
  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
   implementation jscFlavor
  }

  // --- Firebase ---
  implementation platform("com.google.firebase:firebase-bom:33.5.1")
  implementation "com.google.firebase:firebase-analytics"
  implementation "com.google.firebase:firebase-messaging"
  implementation "com.google.firebase:firebase-crashlytics"

  // AdMob (play-services-ads 25.4.0) and UMP (4.0.0) are declared by
  // react-native-google-mobile-ads itself; do not pin older versions here.
  // (optional, but I’d keep it) WorkManager alignment you added earlier
  implementation "androidx.work:work-runtime-ktx:2.8.0"
}


