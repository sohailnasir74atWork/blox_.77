apply plugin: "com.android.library"

def safeExtGet(name, fallback) {
  rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "com.bloxfruitevalues.tradeocr"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Unbundled Latin text model: Google Play services downloads it (~few MB)
  // instead of it shipping in the APK. See the manifest meta-data.
  implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
}
